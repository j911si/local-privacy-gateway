[project]
name = "privacy-gateway"
version = "0.1.0"
description = "Offline pseudonymization gateway between documents and external LLMs"
readme = "README.md"
license = "MIT"
authors = [{ name = "Michael Jung" }]
requires-python = ">=3.12"
keywords = ["privacy", "pseudonymization", "gdpr", "pii", "llm", "proxy", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/j911si/local-privacy-gateway"
Repository = "https://github.com/j911si/local-privacy-gateway"
Issues = "https://github.com/j911si/local-privacy-gateway/issues"

[project.scripts]
pgw = "privacy_gateway.cli:main"
pgw-proxy = "privacy_gateway_proxy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]
proxy = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["privacy_gateway", "privacy_gateway_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
