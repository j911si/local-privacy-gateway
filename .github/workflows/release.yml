name: Release

# Publishes to PyPI with Trusted Publishing when a GitHub release is published.
# Needs a pending publisher on pypi.org for project "privacy-gateway" with
# owner j911si, repository local-privacy-gateway, workflow release.yml, environment pypi.
# The GitHub environment "pypi" should require a reviewer and allow only tags v*.
# GitHub pre-releases are not published to PyPI.
# Only the exact approved commit is published: the owner sets the full 40-character SHA as the
# variable RELEASE_COMMIT of the "pypi" environment before publishing the release
# (gh variable set RELEASE_COMMIT --env pypi --body <sha>). Any other tagged commit fails.
# Define RELEASE_COMMIT only in the environment: a repository or organization variable of the
# same name would be used when the environment has none. The check lives in the workflow of
# the tagged commit, so repository rules must also protect v* tags and the workflow file
# (see the release checklist).
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Tag is on main and matches the package version
        run: |
          git fetch --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/release-tag"
          test "$(git cat-file -t refs/release-tag)" = tag || { echo "tag ${GITHUB_REF_NAME} is not annotated"; exit 1; }
          test "$(git rev-parse refs/release-tag^{commit})" = "${GITHUB_SHA}" || { echo "tag does not point to the event commit"; exit 1; }
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || { echo "checkout is not the event commit"; exit 1; }
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "tagged commit is not on main"; exit 1; }
      - run: uv sync --group proxy --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
      - run: uv build --no-sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Tagged commit is the approved release commit
        env:
          APPROVED: ${{ vars.RELEASE_COMMIT }}
        run: |
          echo "${APPROVED}" | grep -Eqx '[0-9a-f]{40}' || { echo "RELEASE_COMMIT is not set to a full SHA"; exit 1; }
          test "${GITHUB_SHA}" = "${APPROVED}" || { echo "tagged commit ${GITHUB_SHA} is not the approved ${APPROVED}"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
