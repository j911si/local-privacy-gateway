    token_label: PERSON

  SALUTATION:
    category: ROLE
    policy: ignore
  TITLE:
    category: ROLE
    policy: tokenize
  ACADEMIC_TITLE:
    category: ROLE
    policy: tokenize
  JOB_TITLE:
    category: ROLE
    policy: tokenize
    context_words: ['position', 'job title', 'rolle']
  DEPARTMENT:
    category: ROLE
    policy: tokenize
    context_words: ['abteilung', 'department']
  EMPLOYER:
    category: ROLE
    policy: tokenize
    context_words: ['arbeitgeber', 'employer']

  CUSTOMER_NAME:
    category: ORGANIZATION
    policy: tokenize
  ORGANIZATION_NAME:
    category: ORGANIZATION
    policy: tokenize
  PARTNER_NAME:
    category: ORGANIZATION
    policy: tokenize
  SUPPLIER_NAME:
    category: ORGANIZATION
    policy: tokenize

  EMAIL:
    category: CONTACT
    policy: tokenize
  PHONE:
    category: CONTACT
    policy: tokenize
    patterns: ['(?:\+\d{1,3}[ \-]?)?(?:\(?\d{2,5}\)?[ \-/]?)\d{3,}(?:[ \-]?\d{2,})+']
    validator: phone
    context_words: ['tel', 'telefon', 'phone', 'fon']
    context_required: true
  MOBILE_PHONE:
    category: CONTACT
    policy: tokenize
    patterns: ['(?:\+\d{1,3}[ \-]?)?(?:\(?\d{2,5}\)?[ \-/]?)\d{3,}(?:[ \-]?\d{2,})+']
    validator: phone
    context_words: ['mobil', 'mobile', 'handy', 'cell']
    context_required: true
  FAX:
    category: CONTACT
    policy: tokenize
    patterns: ['(?:\+\d{1,3}[ \-]?)?(?:\(?\d{2,5}\)?[ \-/]?)\d{3,}(?:[ \-]?\d{2,})+']
    validator: phone
    context_words: ['fax']
    context_required: true
  SIP_ADDRESS:
    category: CONTACT
    policy: tokenize
  MESSENGER_ID:
    category: CONTACT
    policy: tokenize
  SOCIAL_MEDIA_HANDLE:
    category: CONTACT
    policy: tokenize

  STREET:
    category: LOCATION
    policy: tokenize
  HOUSE_NUMBER:
    category: LOCATION
    policy: tokenize
  POSTAL_CODE:
    category: LOCATION
    policy: tokenize
  CITY:
    category: LOCATION
    policy: tokenize
  ADDRESS:
    category: LOCATION
    policy: tokenize
  COUNTRY:
    category: LOCATION
    policy: tokenize
  BUILDING:
    category: LOCATION
    policy: tokenize
    context_words: ['gebäude', 'building']
  ROOM:
    category: LOCATION
    policy: tokenize
    context_words: ['raum', 'room']
  GPS_COORDINATES:
    category: LOCATION
    policy: tokenize
    patterns: ['-?\d{1,2}\.\d{4,},\s*-?\d{1,3}\.\d{4,}']

  DATE_OF_BIRTH:
    category: BIRTH
    policy: tokenize
    patterns: ['\b\d{1,2}[./]\d{1,2}[./]\d{2,4}\b', '\b\d{4}-\d{2}-\d{2}\b']
    validator: date
    context_words: ['geboren', 'geb.', 'geburtsdatum', 'dob', 'born', 'birthday']
    context_required: true
  PLACE_OF_BIRTH:
    category: BIRTH
    policy: tokenize

  EMPLOYEE_ID:
    category: IDENTIFIER
    policy: tokenize
    context_words: ['mitarbeiter-nr', 'personalnummer', 'employee id']
  CUSTOMER_ID:
    category: IDENTIFIER
    policy: tokenize
    context_words: ['kundennummer', 'customer id', 'customer no', 'kunden-nr']
  ACCOUNT_ID:
    category: IDENTIFIER
    policy: tokenize
    context_words: ['account', 'konto', 'kontonummer', 'acct']
  USER_ID:
    category: IDENTIFIER
    policy: tokenize
    context_words: ['user id', 'userid', 'benutzer-id']
  CONTRACT_ID:
    category: IDENTIFIER
    policy: tokenize
    context_words: ['vertrag', 'vertragsnummer', 'contract']
  INSURANCE_ID:
    category: IDENTIFIER
    policy: tokenize
    context_words: ['versicherungsnummer', 'policy no', 'police']
  TAX_ID:
    category: IDENTIFIER
    policy: tokenize
    patterns: ['\b\d{2}[ ]?\d{3}[ ]?\d{3}[ ]?\d{3}\b', '\b[A-Z]{2}[0-9A-Z]{8,12}\b']
    validator: tax_id
    context_words: ['steuer', 'tax', 'ust', 'vat']
    context_required: true
  SOCIAL_SECURITY_ID:
    category: IDENTIFIER
    policy: tokenize
    patterns: ['\b\d{2}[ ]?\d{6}[ ]?[A-Z][ ]?\d{3}\b', '\b\d{3}-\d{2}-\d{4}\b']
    validator: ssn
    context_words: ['sozialversicherung', 'sv-nummer', 'ssn', 'social security']
  PASSPORT_ID:
    category: IDENTIFIER
    policy: tokenize
    context_words: ['reisepass', 'passport']
  NATIONAL_ID:
    category: IDENTIFIER
    policy: tokenize
    context_words: ['personalausweis', 'ausweisnummer', 'national id']
  DRIVER_LICENSE_ID:
    category: IDENTIFIER
    policy: tokenize
    context_words: ['führerschein', 'driver license']
  VEHICLE_REGISTRATION:
    category: IDENTIFIER
    policy: tokenize
    patterns: ['\b[A-ZÄÖÜ]{1,3}[- ][A-Z]{1,2}[ ]?\d{1,4}[EH]?\b']
    context_words: ['kennzeichen', 'plate']
    context_required: true
  VIN:
    category: IDENTIFIER
    policy: tokenize
    patterns: ['\b[A-HJ-NPR-Z0-9]{17}\b']
    validator: vin
    context_words: ['vin', 'fahrgestell']
  GENERIC_ID:
    category: IDENTIFIER
    policy: tokenize
    priority: 79
    patterns: ['\b[A-Z]{2,6}-\d{2,}(?:-[A-Z0-9]{2,})*\b']

  IBAN:
    category: FINANCIAL
    policy: tokenize
    patterns: ['\b[A-Z]{2}\d{2}(?:[ ]?[A-Z0-9]{4}){2,7}[ ]?[A-Z0-9]{1,4}\b']
    validator: iban
    context_words: ['iban']
  BIC:
    category: FINANCIAL
    policy: tokenize
    patterns: ['\b[A-Z]{6}[A-Z0-9]{2}(?:[A-Z0-9]{3})?\b']
    validator: bic
    context_required: true
    context_words: ['bic', 'swift', 'iban']
  BANK_ACCOUNT:
    category: FINANCIAL
    policy: tokenize
    context_words: ['kontonummer', 'account number']
  CREDIT_CARD:
    category: FINANCIAL
    policy: tokenize
    patterns: ['\b(?:\d[ -]?){13,19}\b']
    validator: luhn
    context_words: ['card', 'karte', 'visa', 'mastercard', 'amex', 'kreditkarte']
  DEBIT_CARD:
    category: FINANCIAL
    policy: tokenize
  CARDHOLDER:
    category: FINANCIAL
    policy: tokenize
  CARD_EXPIRY:
    category: FINANCIAL
    policy: tokenize
    patterns: ['\b(?:0[1-9]|1[0-2])/(?:\d{2}|\d{4})\b']
    context_words: ['expiry', 'gültig bis', 'exp']
    context_required: true
  CVV:
    category: FINANCIAL
    policy: tokenize
    patterns: ['\b\d{3,4}\b']
    context_words: ['cvv', 'cvc', 'prüfziffer']
    context_required: true
  TRANSACTION_ID:
    category: FINANCIAL
    policy: tokenize
    context_words: ['transaktion', 'transaction', 'txn']
  PAYMENT_REFERENCE:
    category: FINANCIAL
    policy: tokenize
    context_words: ['verwendungszweck', 'payment reference']
  INVOICE_ID:
    category: FINANCIAL
    policy: tokenize
    context_words: ['rechnung', 'rechnungsnummer', 'invoice']

  HEALTH_INFORMATION:
    category: HEALTH
    policy: tokenize
  MEDICAL_INFORMATION:
    category: HEALTH
    policy: tokenize
  BIOMETRIC_INFORMATION:
    category: HEALTH
    policy: tokenize
  GENETIC_INFORMATION:
    category: HEALTH
    policy: tokenize

  IP_ADDRESS:
    category: NETWORK
    policy: tokenize
    patterns: ['\b(?:\d{1,3}\.){3}\d{1,3}\b', '\b(?:[0-9a-fA-F]{1,4}:){2,7}[0-9a-fA-F]{1,4}\b']
    validator: ip
  PRIVATE_IP:
    category: NETWORK
    policy: tokenize
    priority: 171
  PUBLIC_IP:
    category: NETWORK
    policy: tokenize
    priority: 171
  MAC_ADDRESS:
    category: NETWORK
    policy: tokenize
    patterns: ['\b(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b']
    validator: mac

  DOMAIN:
    category: DOMAIN
    policy: tokenize
  CUSTOMER_DOMAIN:
    category: DOMAIN
    policy: tokenize
    priority: 151
  INTERNAL_DOMAIN:
    category: DOMAIN
    policy: tokenize
    priority: 151
  HOSTNAME:
    category: DOMAIN
    policy: tokenize
    context_words: [host, hostname, server, node]
  FQDN:
    category: DOMAIN
    policy: tokenize
    patterns:
      - '\b(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.){1,}[A-Za-z]{2,}\b'
    validator: fqdn

  URL:
    category: URL
    policy: tokenize
  INTERNAL_URL:
    category: URL
    policy: tokenize
  API_URL:
    category: URL
    policy: tokenize
  API_ENDPOINT:
    category: URL
    policy: tokenize
  API_PATH:
    category: URL
    policy: tokenize
  QUERY_PARAMETER:
    category: URL
    policy: tokenize
  QUERY_VALUE:
    category: URL
    policy: tokenize

  APPLICATION_NAME:
    category: APPLICATION
    policy: tokenize
    context_words: ['application', 'app']
  SERVICE_NAME:
    category: APPLICATION
    policy: tokenize
    context_words: ['service']
  MICROSERVICE_NAME:
    category: APPLICATION
    policy: tokenize
    context_words: ['microservice']

  CLUSTER_NAME:
    category: KUBERNETES
    policy: tokenize
    context_words: ['cluster']
  NAMESPACE:
    category: KUBERNETES
    policy: tokenize
    context_words: ['namespace', 'ns']
  POD_NAME:
    category: KUBERNETES
    policy: tokenize
    context_words: ['pod', 'pod/']
  CONTAINER_NAME:
    category: KUBERNETES
    policy: tokenize
    context_words: ['container']

  DATABASE_NAME:
    category: DATABASE
    policy: tokenize
    context_words: ['database', 'db name']
  DATABASE_HOST:
    category: DATABASE
    policy: tokenize
    context_words: ['db host', 'database host']
  DATABASE_USER:
    category: DATABASE
    policy: tokenize
    context_words: ['db user', 'database user']

  TENANT_NAME:
    category: TENANT
    policy: tokenize
    context_words: ['tenant']
  TENANT_ID:
    category: TENANT
    policy: tokenize
    context_words: ['tenant id', 'mandant']
  ORGANIZATION_ID:
    category: TENANT
    policy: tokenize
    context_words: ['org id', 'organization id']
  SUBSCRIPTION_ID:
    category: TENANT
    policy: tokenize
    context_words: ['subscription']

  PROJECT_NAME:
    category: PROJECT
    policy: tokenize
    context_words: ['project', 'projekt']
  ENVIRONMENT_NAME:
    category: PROJECT
    policy: tokenize
    context_words: ['environment', 'env', 'umgebung']

  GATEWAY_NAME:
    category: EDGE
    policy: tokenize
    context_words: ['gateway']
  WAF_NAME:
    category: EDGE
    policy: tokenize
    context_words: ['waf']
  LOAD_BALANCER_NAME:
    category: EDGE
    policy: tokenize
    context_words: ['load balancer', 'lb']

  REPOSITORY_NAME:
    category: REPOSITORY
    policy: tokenize
    context_words: ['repo', 'repository']
  BRANCH_NAME:
    category: REPOSITORY
    policy: tokenize
    context_words: ['branch']

  INCIDENT_ID:
    category: TICKET
    policy: tokenize
    context_words: ['incident', 'inc']
  FINDING_ID:
    category: TICKET
    policy: tokenize
    context_words: ['finding']
  TICKET_ID:
    category: TICKET
    policy: tokenize
    context_words: ['ticket', 'ticket-id']
  CASE_ID:
    category: TICKET
    policy: tokenize
    context_words: ['case', 'fall', 'aktenzeichen']

  API_KEY:
    category: SECRET
    policy: redact
    patterns: ['(?i)\b(?:api[_-]?key|x-api-key)["'']?\s*[:=]\s*["'']?([A-Za-z0-9_\-]{16,})']
  ANTHROPIC_API_KEY:
    category: SECRET
    policy: redact
    patterns: ['\bsk-ant-[A-Za-z0-9_\-]{40,}']
  OPENAI_API_KEY:
    category: SECRET
    policy: redact
    patterns: ['\bsk-(?!ant-)(?:proj-)?[A-Za-z0-9_\-]{20,}']
  STRIPE_SECRET_KEY:
    category: SECRET
    policy: redact
    patterns: ['\bsk_(?:live|test)_[A-Za-z0-9]{20,}']
  API_SECRET:
    category: SECRET
    policy: redact
    patterns: ['(?i)\bapi[_-]?secret\s*[:=]\s*["'']?([A-Za-z0-9_\-]{12,})']
  CLIENT_SECRET:
    category: SECRET
    policy: redact
    patterns: ['(?i)\bclient[_-]?secret\s*[:=]\s*["'']?([A-Za-z0-9_\-~.]{12,})']
  PASSWORD:
    category: SECRET
    policy: redact
    patterns:
      - '(?i)\b(?:password|passwd|pwd|kennwort|passwort)["'']?\s*[:=]\s*"([^"\n]{4,})"'
      - '(?i)\b(?:password|passwd|pwd|kennwort|passwort)["'']?\s*[:=]\s*''([^''\n]{4,})'''
      - '(?i)\b(?:password|passwd|pwd|kennwort|passwort)["'']?\s*[:=]\s*(?!["''])(\S[^\n]{3,}?)\s*[.,;:)\]]*$'
  PIN:
    category: SECRET
    policy: redact
    patterns: ['(?i)\bpin\s*[:=]?\s*(\d{4,8})\b']
  TAN:
    category: SECRET
    policy: redact
    patterns: ['(?i)\btan\s*[:=]?\s*(\d{6,8})\b']
  OTP:
    category: SECRET
    policy: redact
    patterns: ['(?i)\b(?:otp|one-time code|einmalcode)\s*[:=]?\s*(\d{6,8})\b']
  ACCESS_TOKEN:
    category: SECRET
    policy: redact
    patterns:
      - '(?i)bearer\s+([A-Za-z0-9._\-]{16,})'
      - '(?i)access[_-]?token\s*[:=]\s*["'']?([A-Za-z0-9._\-]{16,})'
  REFRESH_TOKEN:
    category: SECRET
    policy: redact
    patterns: ['(?i)refresh[_-]?token\s*[:=]\s*["'']?([A-Za-z0-9._\-]{16,})']
  JWT:
    category: SECRET
    policy: redact
    patterns: ['\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b']
  OAUTH_CODE:
    category: SECRET
    policy: redact
    patterns: ['(?i)[?&]code=([A-Za-z0-9._\-]{16,})']
  SESSION_ID:
    category: SECRET
    policy: redact
    patterns: ['(?i)\b(?:session[_-]?id|sessionid|jsessionid|phpsessid)\s*[:=]\s*["'']?([A-Za-z0-9._\-]{8,})']
  SESSION_COOKIE:
    category: SECRET
    policy: redact
  AUTH_COOKIE:
    category: SECRET
    policy: redact
  CSRF_TOKEN:
    category: SECRET
    policy: redact
    patterns: ['(?i)\b(?:csrf[_-]?token|x-csrf-token|_csrf)\s*[:=]\s*["'']?([A-Za-z0-9._\-]{8,})']
  PRIVATE_KEY:
    category: SECRET
    policy: redact
  SSH_PRIVATE_KEY:
    category: SECRET
    policy: redact
  TLS_PRIVATE_KEY:
    category: SECRET
    policy: redact
  AWS_ACCESS_KEY:
    category: SECRET
    policy: redact
    patterns: ['\b(?:AKIA|ASIA)[A-Z0-9]{16}\b']
  AWS_SECRET_KEY:
    category: SECRET
    policy: redact
    patterns: ['\b[A-Za-z0-9/+=]{40}\b']
    context_words: ['aws_secret', 'secret_access_key']
    context_required: true
  AZURE_SECRET:
    category: SECRET
    policy: redact
    patterns: ['\b[A-Za-z0-9~._-]{34,40}\b']
    context_words: ['client_secret', 'azure']
    context_required: true
  GCP_CREDENTIAL:
    category: SECRET
    policy: redact
    patterns:
      - '"private_key_id":\s*"[a-f0-9]{40}"'
      - '\bAIza[0-9A-Za-z_-]{35}\b'
  KUBERNETES_SECRET:
    category: SECRET
    policy: redact
  GITHUB_TOKEN:
    category: SECRET
    policy: redact
    patterns:
      - '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b'
      - '\bgithub_pat_[A-Za-z0-9_]{80,}\b'
  GITLAB_TOKEN:
    category: SECRET
    policy: redact
    patterns: ['\bglpat-[A-Za-z0-9_-]{20,}\b']
  PERSONAL_ACCESS_TOKEN:
    category: SECRET
    policy: redact
    patterns: ['\bxox[baprs]-[A-Za-z0-9-]{10,}\b']
    context_words: ['pat', 'personal access token']
  DATABASE_CONNECTION_STRING:
    category: SECRET
    policy: redact
  SIGNED_URL:
    category: SECRET
    policy: redact
  SAS_TOKEN:
    category: SECRET
    policy: redact

  CUSTOM_HEADER:
    category: HTTP
    policy: tokenize
  HEADER_VALUE:
    category: HTTP
    policy: tokenize
  COOKIE:
    category: HTTP
    policy: tokenize
  COOKIE_VALUE:
    category: HTTP
    policy: tokenize

dictionaries: {}

vault:
  db_path: ~/.local/share/privacy-gateway/vault.db
  key_file: ~/.config/privacy-gateway/vault.key

audit:
  path: ~/.local/share/privacy-gateway/audit.jsonl

restore:
  mode: strict

person:
  record_gender_from_salutation: true

languages: [de, en]

min_confidence: 0.5
